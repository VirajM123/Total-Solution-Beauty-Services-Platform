openapi: 3.0.3
info:
  title: Hii Beauty API
  version: 1.0.0
  description: >
    Backend health, Admin authentication, catalog and public catalog routes.
    Business APIs return API_NOT_CONFIGURED until the explicit
    ADMIN_CATALOG_API_ENABLED flag, development MongoDB URI, and Admin session
    secret are configured and the database is ready. Service
    publication and media uploads remain blocked without persistent storage.
servers:
  - url: http://localhost:5000
paths:
  /health/live:
    get:
      summary: Check whether the API process is running
      responses:
        '200':
          description: API process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
  /health/ready:
    get:
      summary: Check whether required database connectivity is ready
      responses:
        '200':
          description: API and database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Database is not connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/admin/auth/login:
    post:
      summary: Sign in an existing active Admin account
      description: Rate-limited email/password login. Passwords must already be stored as Argon2id hashes; this API does not create accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authenticated Admin identity and CSRF token; session is set in an HttpOnly cookie.
        '400':
          description: Invalid request.
        '401':
          description: Invalid credentials.
        '429':
          description: Too many login attempts.
        '503':
          description: Database or session authentication is not configured.
  /api/admin/auth/session:
    get:
      summary: Return the current Admin session
      security:
        - AdminSession: []
      responses:
        '200':
          description: Safe Admin identity, permissions, and CSRF token.
        '401':
          description: Session is missing, expired, or revoked.
  /api/admin/auth/logout:
    post:
      summary: Revoke the current Admin session
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Session revoked and cookie cleared.
        '401':
          description: Session is missing or expired.
        '403':
          description: Trusted Origin or CSRF validation failed.
  /api/admin/categories:
    get:
      summary: List categories for Admin
      description: Requires catalog.categories.read. Supports page, limit (maximum 100), search, status, sort, and order.
      security:
        - AdminSession: []
      responses:
        '200':
          description: Paginated category records.
        '401':
          description: Admin session required.
        '403':
          description: Permission denied.
    post:
      summary: Create a category
      description: Requires catalog.categories.create. Category code and slug are generated by the server.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                description:
                  type: string
                  maxLength: 1000
                thumbnailMediaId:
                  type: string
                  nullable: true
                displayOrder:
                  type: integer
                  minimum: 0
                status:
                  type: string
                  enum: [draft, published, archived]
      responses:
        '201':
          description: Category created.
        '400':
          description: Invalid fields or media reference.
        '401':
          description: Admin session required.
        '403':
          description: Permission or CSRF validation failed.
        '409':
          description: Duplicate category.
  /api/admin/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      summary: Get category details
      security:
        - AdminSession: []
      responses:
        '200':
          description: Category details.
        '404':
          description: Category not found.
    patch:
      summary: Update category fields
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                description:
                  type: string
                  maxLength: 1000
                thumbnailMediaId:
                  type: string
                  nullable: true
                displayOrder:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Category updated.
        '400':
          description: Invalid fields or media reference.
        '409':
          description: Duplicate category.
  /api/admin/categories/{categoryId}/status:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      summary: Change category lifecycle status
      description: Requires catalog.categories.publish.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleUpdate'
      responses:
        '200':
          description: Category status changed.
  /api/admin/services:
    get:
      summary: List services for Admin
      description: Requires catalog.services.read. Supports page, limit (maximum 100), search, status, categoryId, serviceAreaId, sort, and order.
      security:
        - AdminSession: []
      responses:
        '200':
          description: Paginated service records; paise amounts are returned as decimal integer strings.
    post:
      summary: Create a service
      description: Requires catalog.services.create. priceRupees is converted exactly to integer paise.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, categoryId, priceRupees, durationMinutes]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                categoryId:
                  type: string
                priceRupees:
                  type: string
                  pattern: '^(?:0|[1-9]\d{0,8})(?:\.\d{1,2})?$'
                durationMinutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                shortDescription:
                  type: string
                  maxLength: 240
                fullDescription:
                  type: string
                  maxLength: 3000
                imageMediaIds:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                thumbnailMediaId:
                  type: string
                  nullable: true
                serviceAreaIds:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                isHomeServiceAvailable:
                  type: boolean
                displayOrder:
                  type: integer
                  minimum: 0
                status:
                  type: string
                  enum: [draft, published, archived]
      responses:
        '201':
          description: Service created.
        '400':
          description: Invalid fields, category, media, or service-area reference.
        '503':
          description: Persistent image storage is not configured for publication.
  /api/admin/services/{serviceId}:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get service details
      security:
        - AdminSession: []
      responses:
        '200':
          description: Service details.
        '404':
          description: Service not found.
    patch:
      summary: Update service fields
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                categoryId:
                  type: string
                shortDescription:
                  type: string
                  maxLength: 240
                fullDescription:
                  type: string
                  maxLength: 3000
                priceRupees:
                  type: string
                  pattern: '^(?:0|[1-9]\d{0,8})(?:\.\d{1,2})?$'
                durationMinutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                imageMediaIds:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                thumbnailMediaId:
                  type: string
                  nullable: true
                serviceAreaIds:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                isHomeServiceAvailable:
                  type: boolean
                displayOrder:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Service updated.
        '400':
          description: Invalid fields or references.
        '409':
          description: Duplicate service.
  /api/admin/services/{serviceId}/status:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Change service lifecycle status
      description: Publishing requires complete descriptions, persistent public images, service-area references, and a published category.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleUpdate'
      responses:
        '200':
          description: Service status changed.
        '400':
          description: Service is incomplete or references are invalid.
        '503':
          description: Persistent image storage is not configured.
  /api/catalog/categories:
    get:
      summary: List published categories
      description: Public read; drafts and archived categories are excluded.
      responses:
        '200':
          description: Paginated published categories with safe image metadata.
  /api/catalog/services:
    get:
      summary: List published services
      description: Public read; drafts, archived services, and services with unpublished categories are excluded.
      parameters:
        - in: query
          name: categoryId
          schema:
            type: string
        - in: query
          name: serviceAreaId
          schema:
            type: string
      responses:
        '200':
          description: Paginated eligible public services.
  /api/catalog/services/{serviceId}:
    get:
      summary: Get a published service
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
        - name: serviceAreaId
          in: query
          schema:
            type: string
        responses:
        '200':
          description: Safe public service details.
        '404':
          description: Service is not found or not publicly eligible.
  /api/admin/media/uploads:
    post:
      summary: Upload a public catalog image
      description: Authentication, catalog.media.upload permission, trusted Origin, and CSRF are required. Uploads are disabled until an approved persistent storage adapter is configured.
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '503':
          description: Persistent image storage is not configured.
components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: hi_admin_session
      description: Opaque HttpOnly cookie; production uses the __Host-hi_admin_session name.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
  schemas:
    LifecycleUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [draft, published, archived]
    LiveResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [live]
        requestId:
          type: string
    ReadyResponse:
      type: object
      required: [success, data, requestId]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [status, database]
          properties:
            status:
              type: string
              enum: [ready]
            database:
              type: string
              enum: [connected]
        requestId:
          type: string
    ErrorResponse:
      type: object
      required: [success, error, requestId]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
